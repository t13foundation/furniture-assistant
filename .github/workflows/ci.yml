name: CI

on:
  push:
    branches: [dev, stage, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format (web app code; legacy pipeline files are not format-checked)
        run: uv run ruff format --check src/furniture src/webapp tests/test_furniture_*.py tests/test_webapp_*.py
      - name: Type check (web app code; legacy pipeline has pre-existing diagnostics)
        run: uvx ty check src/furniture src/webapp
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - run: npm run build

  types-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: OpenAPI schema matches webapp/openapi.json (run `make web-types` when this fails)
        run: |
          uv run python -m src.webapp.openapi "$RUNNER_TEMP/openapi.json"
          diff -q "$RUNNER_TEMP/openapi.json" webapp/openapi.json

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install, build and run Playwright (fake model, no secrets)
        working-directory: webapp
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: webapp/test-results
