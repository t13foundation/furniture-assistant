# Pre-commit hooks for furniture-assistant
# Install: make hooks  (or: uv run pre-commit install)
# Run manually: uv run pre-commit run --all-files

repos:
  # ── File quality (fast, language-agnostic) ───────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]  # mkdocs.yml uses !!python/name tags (syntax-only check)
      - id: check-toml
      - id: check-json
        exclude: '^webapp/tsconfig\..*json$'  # JSONC (comments) — validated by tsc
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: '^(docs/app-demo\.mp4|samples/.*)$'
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # ── Ruff: lint + format ──────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # ── Ty: fast type checker (beta, local hook) ─────────────────────
  # Warn-only while ty is in beta (unresolved-import issues are ty limitations)
  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        description: Type check with ty (Astral's fast type checker)
        entry: uvx ty check
        language: system
        pass_filenames: false
        require_serial: true
        stages: [manual]
