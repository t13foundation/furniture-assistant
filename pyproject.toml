[project]
name = "furniture-assistant"
version = "0.1.0"
description = "Extract furniture cutting lists (panel dimensions, board type, edge banding, hardware, qty) from architectural and CAD drawings for CNC manufacturing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic-ai>=0.2",
    "pydantic>=2.0",
    "Pillow>=11.2",
    "pypdfium2>=4.30",
    "rapidfuzz>=3.13",
    "tenacity>=9.1",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "langfuse>=2.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "tqdm>=4.67.3",
    "numpy>=2.4.6",
    "ezdxf>=1.4.4",
    "matplotlib>=3.10",
    # <0.140: newer FastAPI requires opentelemetry-api>=1.44, which breaks pydantic-ai 0.8 (opentelemetry._events)
    "fastapi>=0.115,<0.140",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "rectpack>=0.2.2",
]

[project.optional-dependencies]
ocr-glm = [
    "glmocr",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pre-commit>=4.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests", "config"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"src/document/loader.py" = ["E402", "F821"]
"src/tools/registry.py" = ["F821"]

[tool.ty.environment]
# Repo root on the roots so the `src.` absolute import layout resolves
# (code uses `from src.pipeline... import ...`, run from the repo root).
root = ["."]
